services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    volumes:
      - .:/var/www/html:z
    working_dir: /var/www/html

  mariadb:
    image: docker.io/library/mariadb:12
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/pt04_ana_bonilla.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      MARIADB_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: docker.io/library/nginx:1.31-alpine
    depends_on:
      - app
    ports:
      - target: 80
        published: 8081
    volumes:
      - .:/var/www/html:ro,z
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,Z

  adminer:
    image: docker.io/library/adminer:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      - target: 8080
        published: 8082
    environment:
      ADMINER_DEFAULT_SERVER: db

  mailpit:
    image: docker.io/axllent/mailpit:latest
    ports:
      - target: 8025
        published: 8083

volumes:
  mariadb_data:
